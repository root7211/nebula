<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nebula — WebGPU Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
    #nebula-canvas {
      display: block;
      width: 100%;
      height: 100%;
      /* Emscripten GLFW maps to this canvas */
    }
    #loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #ccc;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 14px;
      z-index: 100;
      transition: opacity 0.3s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading h1 { font-size: 24px; margin-bottom: 16px; color: #fff; }
    #loading .spinner {
      width: 32px; height: 32px;
      border: 3px solid #333;
      border-top-color: #7cf;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading .status { color: #888; font-size: 12px; }
    #error-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(17,17,17,0.95);
      color: #f88;
      font-family: monospace;
      font-size: 14px;
      padding: 40px;
      z-index: 200;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="loading">
    <h1>Nebula</h1>
    <div class="spinner"></div>
    <div class="status" id="status">Initializing WebGPU...</div>
  </div>
  <div id="error-overlay"></div>
  <canvas id="nebula-canvas" width="800" height="600" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

  <script>
    // Check WebGPU support before loading WASM
    (async function() {
      const statusEl = document.getElementById('status');
      const errorEl = document.getElementById('error-overlay');

      if (!navigator.gpu) {
        errorEl.style.display = 'block';
        errorEl.textContent = 'WebGPU is not supported in this browser.\n\n' +
          'Requirements:\n' +
          '  - Chrome 113+ / Edge 113+ / Firefox Nightly (with flags)\n' +
          '  - Hardware GPU acceleration enabled\n\n' +
          'Please update your browser or enable WebGPU.';
        document.getElementById('loading').classList.add('hidden');
        return;
      }

      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) {
        errorEl.style.display = 'block';
        errorEl.textContent = 'WebGPU: Failed to get GPU adapter.\n\n' +
          'Your browser supports WebGPU but no compatible GPU was found.\n' +
          'Ensure hardware acceleration is enabled in browser settings.';
        document.getElementById('loading').classList.add('hidden');
        return;
      }

      statusEl.textContent = 'Loading WASM module...';
    })();

    // Emscripten Module configuration
    var Module = {
      canvas: (function() { return document.getElementById('nebula-canvas'); })(),
      onRuntimeInitialized: function() {
        document.getElementById('loading').classList.add('hidden');
      },
      print: function(text) { console.log('[nebula]', text); },
      printErr: function(text) {
        console.error('[nebula]', text);
        // Show fatal errors in overlay
        if (text.includes('Aborted') || text.includes('RuntimeError')) {
          var el = document.getElementById('error-overlay');
          el.style.display = 'block';
          el.textContent += text + '\n';
        }
      },
      setStatus: function(text) {
        if (text) {
          document.getElementById('status').textContent = text;
        }
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
