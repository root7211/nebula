<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nebula — WebGPU Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
    #nebula-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #ccc;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 14px;
      z-index: 100;
      transition: opacity 0.3s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading h1 { font-size: 24px; margin-bottom: 16px; color: #fff; }
    #loading .spinner {
      width: 32px; height: 32px;
      border: 3px solid #333;
      border-top-color: #7cf;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading .status { color: #888; font-size: 12px; }
    #error-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(17,17,17,0.95);
      color: #f88;
      font-family: monospace;
      font-size: 14px;
      padding: 40px;
      z-index: 200;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="loading">
    <h1>Nebula</h1>
    <div class="spinner"></div>
    <div class="status" id="status">Initializing WebGPU...</div>
  </div>
  <div id="error-overlay"></div>
  <canvas id="nebula-canvas" width="800" height="600" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

  <script>
    // =========================================================================
    // Nebula WASM Loader
    //
    // Fix: WebGPU device MUST be created BEFORE Emscripten's JS executes.
    // Emscripten 4.0.6 with -sUSE_WEBGPU=1 treats WebGPU init as an async
    // dependency during module startup. If Module.preinitializedWebGPUDevice
    // is not set when the Emscripten script runs, onRuntimeInitialized may
    // never fire.
    //
    // Solution: Initialize WebGPU first, set preinitializedWebGPUDevice on
    // Module, THEN dynamically load the Emscripten-generated JS.
    // =========================================================================
    (async function() {
      var statusEl = document.getElementById('status');
      var errorEl = document.getElementById('error-overlay');

      // 1. Check WebGPU support
      if (!navigator.gpu) {
        errorEl.style.display = 'block';
        errorEl.textContent = 'WebGPU is not supported in this browser.\n\n' +
          'Requirements:\n' +
          '  - Chrome 113+ / Edge 113+ / Firefox Nightly (with flags)\n' +
          '  - Hardware GPU acceleration enabled';
        document.getElementById('loading').classList.add('hidden');
        return;
      }

      // 2. Request adapter
      statusEl.textContent = 'Requesting GPU adapter...';
      var adapter = await navigator.gpu.requestAdapter();
      if (!adapter) {
        errorEl.style.display = 'block';
        errorEl.textContent = 'WebGPU: Failed to get GPU adapter.\n\n' +
          'Your browser supports WebGPU but no compatible GPU was found.\n' +
          'Ensure hardware acceleration is enabled in browser settings.';
        document.getElementById('loading').classList.add('hidden');
        return;
      }

      // 3. Request device
      statusEl.textContent = 'Creating GPU device...';
      var device = await adapter.requestDevice();
      if (!device) {
        errorEl.style.display = 'block';
        errorEl.textContent = 'WebGPU: Failed to create GPU device.';
        document.getElementById('loading').classList.add('hidden');
        return;
      }

      // 4. Configure Module with pre-initialized device BEFORE script loads
      statusEl.textContent = 'Loading WASM module...';
      window.Module = {
        canvas: document.getElementById('nebula-canvas'),
        noInitialRun: true,
        preinitializedWebGPUDevice: device,
        print: function(text) { console.log('[nebula]', text); },
        printErr: function(text) {
          console.error('[nebula]', text);
          if (text.includes('Aborted') || text.includes('RuntimeError')) {
            errorEl.style.display = 'block';
            errorEl.textContent += text + '\n';
          }
        },
        setStatus: function(text) {
          if (text) statusEl.textContent = text;
        },
        onRuntimeInitialized: function() {
          statusEl.textContent = 'Starting...';
          document.getElementById('loading').classList.add('hidden');
          Module.callMain();
        }
      };

      // 5. Dynamically load the Emscripten-generated JS
      //    The script name matches the HTML filename (e.g. button_v2_demo.js)
      var htmlName = window.location.pathname.split('/').pop().replace('.html', '');
      var script = document.createElement('script');
      script.src = htmlName + '.js';
      script.onerror = function() {
        errorEl.style.display = 'block';
        errorEl.textContent = 'Failed to load WASM module: ' + htmlName + '.js';
        document.getElementById('loading').classList.add('hidden');
      };
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
